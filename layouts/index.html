<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Site.Title }}</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f7f8fa; color:#1c2230;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
.top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
.sub { color:#5b6472; font-size:13px; margin:0; }
.controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.toggle { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#3a4250;
  background:#fff; border:1px solid #e6e8ec; border-radius:8px; padding:6px 10px; cursor:pointer; }
.search { background:#fff; border:1px solid #e6e8ec; border-radius:8px; color:#263041;
  font-size:12.5px; padding:6px 10px; min-width:180px; }
.select { appearance:none; background:#fff; border:1px solid #e6e8ec; border-radius:8px; color:#263041;
  font-size:12.5px; padding:6px 30px 6px 10px; min-width:150px; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
.legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; background:#fff;
  border:1px solid #e6e8ec; border-radius:10px; padding:10px 14px; margin:18px 0 22px; }
.legend .grp { display:flex; align-items:center; gap:7px; font-size:12.5px; color:#3a4250; }
.badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:999px; white-space:nowrap; }
.badge.confirmed { background:#e5f4ec; color:#12784a; border:1px solid #b8e0c9; }
.badge.estimated { background:#fdf3e0; color:#9a6a10; border:1px dashed #f0d8a3; }
.tier-chip { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:5px; white-space:nowrap; }
.dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
.section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:#78808e; margin:26px 0 12px; }
.timeline { background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:16px 16px 8px; overflow-x:auto; }
.tl-inner { min-width:760px; position:relative; }
.tl-axis { position:relative; height:22px; margin-left:160px; border-bottom:1px solid #e6e8ec; }
.tl-month { position:absolute; top:2px; font-size:10.5px; color:#9aa1ad; transform:translateX(-50%); }
.tl-grid { position:absolute; top:0; bottom:0; width:1px; background:#f0f1f4; }
.tl-row { position:relative; height:42px; display:flex; align-items:center; }
.tl-row:hover { background:#fafbfc; }
.tl-label { width:160px; flex:0 0 160px; padding-right:10px; font-weight:600; font-size:12.5px; }
.tl-label .loc { display:block; font-weight:400; color:#8a91a0; font-size:10.5px; }
.tl-track { position:relative; flex:1; height:100%; }
.tl-lane { position:absolute; left:0; right:0; top:50%; height:2px; background:#eef0f3; }
.milestone { position:absolute; top:50%; transform:translate(-50%,-50%); }
.milestone .m-dot { width:13px; height:13px; border-radius:50%; }
.milestone.confirmed .m-dot { background:#1a9e5f; box-shadow:0 0 0 3px #e5f4ec; }
.milestone.estimated .m-dot { background:#fff; border:2px dashed #d69a2a; box-shadow:0 0 0 3px #fdf3e0; }
.confbar { position:absolute; top:50%; transform:translateY(-50%); height:15px; border-radius:5px;
  background:linear-gradient(90deg,#3d6df0,#5b86f5); box-shadow:0 1px 3px rgba(61,109,240,.3); }
.milestone .tip,.confbar .tip { visibility:hidden; opacity:0; position:absolute; bottom:20px; left:50%;
  transform:translateX(-50%); background:#1c2230; color:#fff; padding:5px 9px; border-radius:6px;
  font-size:11px; white-space:nowrap; z-index:10; transition:opacity .12s; pointer-events:none; }
.milestone:hover .tip,.confbar:hover .tip { visibility:visible; opacity:1; }
.today-line { position:absolute; top:16px; bottom:8px; width:2px; background:#e0453a; z-index:5; }
.today-line::after { content:"Today"; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
  font-size:9.5px; color:#e0453a; font-weight:700; background:#fff; padding:0 2px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.card { background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:16px 16px 12px; }
.card.next { border-color:#c3d3fb; box-shadow:0 0 0 3px #eaf0fe; }
.card.flagged { background:#fff8f6; border-color:#f0b3aa; box-shadow:inset 4px 0 0 #d94a38; }
.card h3 { margin:0 0 2px; font-size:15.5px; }
.card .meta { color:#6b7280; font-size:12px; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card .core { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; background:#eef1f6; color:#4a5566; }
.card .region { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; background:#eef1f6; color:#4a5566; }
.card .region.warn { background:#fdecea; color:#b0392c; border:1px solid #f0b3aa; }
.card .countdown { font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:#eef7f1; color:#1a7a4a; }
.card .countdown.soon { background:#fdecea; color:#c23b2e; }
.topics { display:flex; flex-wrap:wrap; gap:5px; margin:-3px 0 10px; }
.topic { font-size:10.5px; color:#53606f; background:#f3f5f8; border:1px solid #e7eaf0; border-radius:999px; padding:2px 7px; }
.stage { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-top:1px solid #f1f2f5; }
.stage:first-of-type { border-top:none; }
.stage .s-name { display:flex; align-items:center; gap:7px; font-size:12.5px; color:#3a4250; }
.stage.nextup .s-name { font-weight:700; color:#2a52c0; }
.stage .s-right { display:flex; align-items:center; gap:8px; }
.stage .s-date { font-size:12.5px; font-weight:600; }
.mini { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:999px; }
.mini.confirmed { background:#e5f4ec; color:#12784a; }
.mini.estimated { background:#fdf3e0; color:#9a6a10; border:1px dashed #e6c37a; }
.empty { background:#fff; border:1px dashed #d5dae2; border-radius:12px; padding:40px 24px; text-align:center; color:#6b7280; }
.empty h3 { margin:0 0 6px; color:#3a4250; font-size:16px; }
.foot { margin-top:28px; color:#9aa1ad; font-size:11.5px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>📚 ConfView</h1>
      <p class="sub" id="subtitle">{{ .Site.Params.subtitle }}</p>
    </div>
    <div class="controls">
      <input type="search" class="search" id="search" placeholder="Search name, place, topic…" aria-label="Search conferences">
      <select class="select" id="tierFilter" aria-label="Filter by tier">
        <option value="">All tiers</option>
        {{- range .Site.Data.tiers }}
        <option value="{{ .id }}">{{ .label | default (printf "Tier %s" .id) }}</option>
        {{- end }}
      </select>
      <select class="select" id="topicFilter" aria-label="Filter by topic">
        <option value="">All topics</option>
      </select>
      <label class="toggle"><input type="checkbox" id="showPast"> Show past deadlines</label>
    </div>
  </div>

  <div class="legend">
    {{- range .Site.Data.tiers }}
    <div class="grp"><span class="tier-chip" style="background:{{ .bg | default "#eef1f6" }};color:{{ .color | default "#4a5566" }}">{{ .short | default .id }}</span> {{ .blurb }}</div>
    {{- end }}
    <div class="grp"><span class="badge confirmed">✓ Confirmed</span> official date from the CFP page</div>
    <div class="grp"><span class="badge estimated">≈ Estimated</span> inferred, not yet officially published</div>
    <div class="grp" style="margin-left:auto"><span class="dot" style="width:14px;height:12px;border-radius:4px;background:linear-gradient(90deg,#3d6df0,#5b86f5)"></span> Conference days</div>
  </div>

  <div id="content"></div>
  <div class="foot" id="foot"></div>
</div>

<!-- Data baked in at build time by Hugo. Edit data/conferences.json (or run the
     refresh tool) and data/tiers.yaml, then rebuild the site to update these. -->
<script id="cv-data" type="application/json">{{ .Site.Data.conferences | jsonify | safeJS }}</script>
<script id="cv-tiers" type="application/json">{{ .Site.Data.tiers | jsonify | safeJS }}</script>
<script id="cv-params" type="application/json">{{ dict "preferredRegion" .Site.Params.preferredRegion | jsonify | safeJS }}</script>

<script>
const DATA   = JSON.parse(document.getElementById("cv-data").textContent);
const TIERS  = JSON.parse(document.getElementById("cv-tiers").textContent) || [];
const PARAMS = JSON.parse(document.getElementById("cv-params").textContent) || {};
const TIER_BY_ID = Object.fromEntries(TIERS.map(t => [String(t.id), t]));
const PREFERRED_REGION = PARAMS.preferredRegion || "";

const STAGE_META = [
  { key:"submission",   name:"Submission",   ico:"📝" },
  { key:"notification", name:"Notification", ico:"📢" },
  { key:"camera_ready", name:"Camera-Ready", ico:"🖨" },
];
const TODAY = new Date(); TODAY.setHours(12,0,0,0);
const parse = d => new Date(d+"T12:00:00");
const fmt = d => parse(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const fmtShort = d => parse(d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const utcDay = dt => Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
const days = d => Math.round((utcDay(parse(d)) - utcDay(TODAY))/86400000);
// Data values go into innerHTML below, so escape them; status doubles as a CSS class.
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const statusOf = st => st && st.status === "confirmed" ? "confirmed" : "estimated";

// A conference outside the preferred region is flagged only for tiers that opt
// in via data/tiers.yaml (flag_outside_region).
function isOutsideRegion(c){
  const t = TIER_BY_ID[String(c.tier)];
  if (!t || !t.flag_outside_region || !PREFERRED_REGION) return false;
  return c.region && c.region !== PREFERRED_REGION && c.region !== "TBD";
}

// Submission date as a Date, or null if missing/invalid (refresh.py's
// _submission_date() does the same for its listing).
function submissionDate(c){
  const d = c && c.stages && c.stages.submission && c.stages.submission.date;
  if (!d) return null;
  const dt = parse(d);
  return isNaN(dt) ? null : dt;
}

// Free-text search: every whitespace-separated term must appear somewhere in
// the conference's name, full name, location, region, tier or topics.
// Negative regions such as "Non-Europe" are left out, so that searching
// "europe" does not match them.
function matchesSearch(c, terms){
  if (!terms.length) return true;
  const region = /^non-/i.test(c.region || "") ? "" : c.region;
  const hay = [c.name, c.full_name, c.location, region, c.tier, ...(c.topics || [])]
    .filter(Boolean).join(" ").toLowerCase();
  return terms.every(t => hay.includes(t));
}

// Conferences to show: future deadlines only (unless includePast), optional
// tier/topic/search filters, soonest submission first.
function upcoming(includePast, tier, topic, query){
  const terms = (query || "").toLowerCase().split(/\s+/).filter(Boolean);
  tier = tier || null;
  topic = topic ? topic.toLowerCase() : null;
  const rows = (DATA.conferences || []).filter(c => {
    if (!c || !c.conference || !c.conference.start || !c.conference.end) return false;
    const sub = submissionDate(c);
    const due = sub || (c.conference && c.conference.end ? parse(c.conference.end) : null);
    if (!includePast && (due === null || due < TODAY)) return false;
    if (tier && String(c.tier || "") !== tier) return false;
    if (topic && !(c.topics || []).map(t => String(t).toLowerCase()).includes(topic)) return false;
    if (!matchesSearch(c, terms)) return false;
    return true;
  });
  rows.sort((a,b) => (submissionDate(a) || new Date(8.64e15)) - (submissionDate(b) || new Date(8.64e15)));
  return rows;
}

function allTopics(){
  return [...new Set((DATA.conferences || []).flatMap(c => c.topics || []))].sort();
}

function main(){
  const showPast = document.getElementById("showPast").checked;
  const tier = document.getElementById("tierFilter").value;
  const topic = document.getElementById("topicFilter").value;
  const query = document.getElementById("search").value;
  const content = document.getElementById("content");

  const confs = upcoming(showPast, tier, topic, query);
  const total = (DATA.conferences || []).length;

  document.getElementById("subtitle").textContent =
    `${confs.length} shown of ${total} tracked · data updated ${DATA.last_updated || "—"}`;
  document.getElementById("foot").textContent =
    "ConfView · dates from official conference sites · estimated dates are refined as organizers publish them.";

  if (!confs.length){
    content.innerHTML = `<div class="empty">
      <h3>No conferences with an upcoming submission deadline</h3>
      <p>Every tracked conference's paper deadline has passed for the current filter.
      Tick “Show past deadlines” to see the full list.</p>
    </div>`;
    return;
  }
  content.innerHTML = `
    <div class="section-title">Timeline</div>
    <div class="timeline"><div class="tl-inner" id="timeline"></div></div>
    <div class="section-title">Details</div>
    <div class="cards" id="cards"></div>`;
  renderTimeline(confs);
  renderCards(confs);
}

function populateTopicFilter(){
  const el = document.getElementById("topicFilter");
  allTopics().forEach(t => {
    const opt = document.createElement("option"); opt.value = t; opt.textContent = t; el.appendChild(opt);
  });
}

function axisRange(confs){
  const ds = [];
  confs.forEach(c => { ds.push(submissionDate(c) || parse(c.conference.start), parse(c.conference.end)); });
  let mn = new Date(Math.min(...ds)), mx = new Date(Math.max(...ds));
  mn = new Date(mn.getFullYear(), mn.getMonth(), 1);
  mx = new Date(mx.getFullYear(), mx.getMonth()+1, 1);
  return [mn, mx];
}

function renderTimeline(confs){
  const tl = document.getElementById("timeline");
  const [mn, mx] = axisRange(confs);
  const span = mx - mn;
  const pct = d => (((d instanceof Date ? d : parse(d)) - mn)/span)*100;

  const axis = document.createElement("div"); axis.className="tl-axis";
  let m = new Date(mn);
  while(m < mx){
    const g=document.createElement("div"); g.className="tl-grid"; g.style.left=pct(m)+"%"; axis.appendChild(g);
    const lab=document.createElement("div"); lab.className="tl-month"; lab.style.left=pct(m)+"%";
    lab.textContent=m.toLocaleDateString("en-US",{month:"short",year:"2-digit"}); axis.appendChild(lab);
    m = new Date(m.getFullYear(), m.getMonth()+1, 1);
  }
  tl.appendChild(axis);

  confs.forEach(c=>{
    c.stages = c.stages || {};
    const row=document.createElement("div"); row.className="tl-row";
    const lab=document.createElement("div"); lab.className="tl-label";
    lab.innerHTML=`${esc(c.name)} ${esc(c.edition_year)}<span class="loc">📍 ${esc(c.location)}</span>`;
    row.appendChild(lab);
    const track=document.createElement("div"); track.className="tl-track";
    const lane=document.createElement("div"); lane.className="tl-lane"; track.appendChild(lane);
    STAGE_META.forEach(s=>{
      const st=c.stages[s.key]; if(!st||!st.date) return;
      const ms=document.createElement("div"); ms.className="milestone "+statusOf(st);
      ms.style.left=pct(st.date)+"%";
      ms.innerHTML=`<div class="m-dot"></div><div class="tip">${s.ico} ${s.name}: ${fmt(st.date)} · ${statusOf(st)}</div>`;
      track.appendChild(ms);
    });
    const cb=document.createElement("div"); cb.className="confbar";
    const l=pct(c.conference.start), r=pct(c.conference.end);
    cb.style.left=l+"%"; cb.style.width=Math.max(r-l,1.4)+"%";
    cb.innerHTML=`<div class="tip">🎤 ${esc(c.name)} ${esc(c.edition_year)}: ${fmt(c.conference.start)} – ${fmt(c.conference.end)}</div>`;
    track.appendChild(cb);
    row.appendChild(track);
    tl.appendChild(row);
  });

  if (TODAY >= mn && TODAY <= mx){
    const tline=document.createElement("div"); tline.className="today-line";
    tline.style.left=`calc(160px + (100% - 160px) * ${pct(TODAY)/100})`;
    tl.appendChild(tline);
  }
}

function renderCards(confs){
  const el = document.getElementById("cards");
  confs.forEach((c, i)=>{
    const flagged = isOutsideRegion(c);
    const card=document.createElement("div");
    card.className=["card", i===0 ? "next" : "", flagged ? "flagged" : ""].filter(Boolean).join(" ");

    const tierDef = TIER_BY_ID[String(c.tier)];
    const coreStyle = tierDef ? `style="background:${esc(tierDef.bg||"#eef1f6")};color:${esc(tierDef.color||"#4a5566")}"` : "";
    const coreText = esc(tierDef ? (tierDef.short || tierDef.id) : (c.tier || "—"));
    const regionCls = flagged ? "region warn" : "region";
    const regionText = flagged ? `${coreText} outside ${esc(PREFERRED_REGION)}` : esc(c.region || "Region TBD");
    const sub = c.stages.submission && c.stages.submission.date;
    const dleft = sub ? days(sub) : null;
    const cdCls = dleft!==null && dleft>=0 && dleft<=21 ? "countdown soon" : "countdown";

    let html=`<h3>${esc(c.name)} ${esc(c.edition_year)}</h3>
      <div class="meta">📍 ${esc(c.location)} <span class="core" ${coreStyle}>Tier ${coreText}</span>
      <span class="${regionCls}">${regionText}</span>
      <span class="${cdCls}">${dleft===null?"no paper deadline":dleft>=0?dleft+" days to submit":"deadline passed"}</span></div>`;
    if (c.topics && c.topics.length){
      html += `<div class="topics">${c.topics.map(t=>`<span class="topic">${esc(t)}</span>`).join("")}</div>`;
    }
    const rows=[
      ...STAGE_META.map(s=>({...s, st:c.stages[s.key]})),
      {key:"conference", name:"Conference", ico:"🎤",
       st:{date:c.conference.start, end:c.conference.end, status:c.conference.status}},
    ];
    let nu=null, nut=Infinity;
    rows.forEach(r=>{ if(!r.st?.date) return; const t=parse(r.st.date)-TODAY; if(t>=0&&t<nut){nut=t;nu=r.key;} });
    rows.forEach(r=>{
      if(!r.st?.date) return;
      const cls=["stage"]; if(r.key===nu) cls.push("nextup");
      const dateTxt = r.key==="conference"
        ? `${fmt(r.st.date)} – ${fmtShort(r.st.end)}` : fmt(r.st.date);
      const status = statusOf(r.st);
      const badge = (r.key==="conference" && status==="confirmed") ? "" :
        `<span class="mini ${status}">${status==="confirmed"?"✓ conf":"≈ est"}</span>`;
      html+=`<div class="${cls.join(' ')}">
        <div class="s-name"><span>${r.ico}</span>${r.name}</div>
        <div class="s-right">${badge}<span class="s-date">${dateTxt}</span></div></div>`;
    });
    card.innerHTML=html; el.appendChild(card);
  });
}

populateTopicFilter();
document.getElementById("showPast").addEventListener("change", main);
document.getElementById("tierFilter").addEventListener("change", main);
document.getElementById("topicFilter").addEventListener("change", main);
document.getElementById("search").addEventListener("input", main);
main();
</script>
</body>
</html>
