# Weekly data refresh.
#
# Runs the scraper and, if any date changed, opens (or updates) ONE pull request
# from the fixed branch `auto/refresh-data`. The data is replaced in place, never
# appended to: conferences.json keeps one entry per conference, a newer edition
# overwrites the older one, and no timestamps or run logs are stored in it, so
# the file does not grow from run to run. A run that finds nothing new changes
# nothing and opens no PR; a run that cannot parse any page fails instead.
#
# Dates already marked "confirmed" are never overwritten; disagreements with the
# live page are listed as CONFLICT lines in the job summary for a person to check.
name: Refresh conference data

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python tests/test_scrapers.py

      - name: Scrape CFP pages
        run: |
          set -o pipefail
          python refresh.py --fail-under 5 2>&1 | tee refresh.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Refresh result"
            grep -E '^parsed ' refresh.log || true
            echo
            echo "### Entries moved to a new edition (check these first)"
            echo '```'
            grep -E 'edition [0-9]+ -> ' refresh.log || echo "none"
            echo '```'
            echo
            echo "### Conflicts with confirmed dates (not applied, check by hand)"
            echo '```'
            grep CONFLICT refresh.log || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f refresh.log

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto/refresh-data
          delete-branch: true
          add-paths: data/conferences.json
          commit-message: "data: weekly CFP refresh"
          title: "Weekly CFP refresh"
          body: |
            Automated run of `refresh.py`. Dates found on the official pages are
            marked confirmed; dates moved to a new edition are marked estimated.
            Confirmed dates were not changed; see the run's job summary for
            conflicts. Review the diff before merging.
